# Публичный вход стенда (BE-13): наружу только фронтенд и /api; /internal и /health закрыты.
# FE и API на одном origin - cookie SameSite=Lax и проверка Origin работают без CORS (D-003).
server {
    listen 443 ssl http2;
    server_name fire-atlas.example;           # заменить адресом стенда
    ssl_certificate     /etc/ssl/fire-atlas/fullchain.pem;
    ssl_certificate_key /etc/ssl/fire-atlas/privkey.pem;

    client_max_body_size 256k;                 # совпадает с FA лимитом тела
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    root /srv/fire-atlas/web;                  # сборка apps/web
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # перезапись: клиентский XFF не принимается
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;                # больше дедлайна анализа (45 с); задачи все равно фоновые
    }

    location /internal/ { return 404; }
    location /health/   { allow 127.0.0.1; deny all; proxy_pass http://api:8000; }
}

server {
    listen 80;
    server_name fire-atlas.example;
    return 301 https://$host$request_uri;
}
