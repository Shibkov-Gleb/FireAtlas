openapi: 3.1.0
info:
  title: Fire Atlas Public API
  version: 1.0.0
  description: Предварительный контракт фронтенда по ТЗ 04.11.2026. Не является реализацией сервера. SearchRequest.sort —
    явное расширение для FE-05; перед интеграцией согласовать с BE. Cookie и CSRF определяются серверной реализацией;
    клиент поддерживает double-submit csrf_token → X-CSRF-Token.
servers:
  - url: /api/v1
security:
  - guestSession: []
paths:
  /config:
    get:
      operationId: getConfig
      summary: getConfig
      parameters: []
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Config"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: &a2
          description: Безопасная ошибка CT-12
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /workspaces:
    post:
      operationId: createWorkspace
      summary: createWorkspace
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: false
      responses:
        "200": &a1
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Workspace"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        "201": *a1
        default: *a2
  /workspaces/current:
    get:
      operationId: getWorkspace
      summary: getWorkspace
      parameters: []
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Workspace"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
    patch:
      operationId: patchWorkspace
      summary: patchWorkspace
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: &a3
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspacePatch"
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Workspace"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /search:
    post:
      operationId: search
      summary: search
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SearchResult"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /investigations/{id}:
    get:
      operationId: getInvestigation
      summary: getInvestigation
      parameters:
        - &a4
          name: id
          in: path
          required: true
          schema: &a8
            type: string
            pattern: ^[A-Za-z0-9_-]{1,128}$
        - &a5
          name: data_revision
          in: query
          required: true
          schema: *a3
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InvestigationDetail"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /investigations/{id}/runs:
    get:
      operationId: getRuns
      summary: getRuns
      parameters:
        - *a4
        - *a5
        - name: cursor
          in: query
          required: false
          schema: *a3
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RunList"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /runs/{id}:
    get:
      operationId: getRun
      summary: getRun
      parameters:
        - *a4
        - *a5
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TestRun"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /evidence/{id}:
    get:
      operationId: getEvidence
      summary: getEvidence
      parameters:
        - *a4
        - *a5
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EvidenceDetail"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /sources/{id}:
    get:
      operationId: getSource
      summary: getSource
      parameters:
        - *a4
        - *a5
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Source"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /measurements/query:
    post:
      operationId: queryMeasurements
      summary: queryMeasurements
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasurementRequest"
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MeasurementResponse"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /comparisons:
    post:
      operationId: compare
      summary: compare
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonRequest"
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ComparisonResponse"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /applicability:
    post:
      operationId: getApplicability
      summary: getApplicability
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicabilityRequest"
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ApplicabilityResult"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /analyses:
    post:
      operationId: createAnalysis
      summary: createAnalysis
      parameters:
        - &a6
          name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
      responses:
        "202":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Job"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /jobs/{id}:
    get:
      operationId: getJob
      summary: getJob
      parameters:
        - *a4
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Job"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
    delete:
      operationId: cancelJob
      summary: cancelJob
      parameters:
        - *a4
      responses:
        "204":
          description: Успех
        default: *a2
  /answers/{id}:
    get:
      operationId: getAnswer
      summary: getAnswer
      parameters:
        - *a4
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AnalysisResult"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /reports:
    post:
      operationId: createReport
      summary: createReport
      parameters:
        - *a6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "202":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Job"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /reports/{id}:
    get:
      operationId: getReport
      summary: getReport
      parameters:
        - *a4
      responses:
        "200":
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Report"
                  meta:
                    $ref: "#/components/schemas/Meta"
                required:
                  - data
                  - meta
                additionalProperties: false
        default: *a2
  /reports/{id}/download:
    get:
      operationId: downloadReport
      parameters:
        - *a4
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        default: *a2
components:
  securitySchemes:
    guestSession:
      type: apiKey
      in: cookie
      name: fire_atlas_session
  schemas:
    Unit:
      type: string
      enum:
        - Pa
        - m_s
        - m
        - s
        - K
        - fraction
        - g_fraction
        - count
        - dimensionless
    Scope:
      type: string
      enum:
        - prevention
        - detection
        - suppression
    Gravity:
      type: string
      enum:
        - normal
        - microgravity
        - partial
        - simulated_partial
        - unknown
    FuelState:
      type: string
      enum:
        - solid
        - liquid
        - gas
        - aerosol
    Geometry:
      type: string
      enum:
        - film
        - sheet
        - slab
        - rod
        - sphere
        - droplet
        - fabric
        - other
        - unknown
    Quantity:
      type: object
      properties:
        value: &a10
          type:
            - number
            - "null"
        unit:
          $ref: "#/components/schemas/Unit"
        status:
          type: string
          enum:
            - measured
            - reported
            - derived
            - not_reported
            - not_applicable
            - unusable
        qualifier:
          type:
            - string
            - "null"
          enum:
            - eq
            - lt
            - lte
            - gt
            - gte
        raw_value: &a7
          type:
            - string
            - "null"
        raw_unit: *a7
        uncertainty:
          type:
            - number
            - "null"
          minimum: 0
        evidence_ids: &a9
          type: array
          items: *a8
        derivation:
          type:
            - object
            - "null"
          properties:
            formula_id: *a3
            input_refs: *a9
          required:
            - formula_id
            - input_refs
          additionalProperties: false
      required:
        - value
        - unit
        - status
        - qualifier
        - raw_value
        - raw_unit
        - uncertainty
        - evidence_ids
        - derivation
      additionalProperties: false
    Source:
      type: object
      properties:
        id: *a8
        data_revision: *a3
        title: *a3
        kind:
          type: string
          enum:
            - repository
            - report
            - publication
            - experimental_table
            - video
            - image
            - calibration
        canonical_url:
          type: string
          format: uri
          pattern: ^https://
        doi: *a7
        publication_date: *a7
        retrieved_at: &a12
          type: string
          format: date-time
        license: *a7
        availability:
          type: string
          enum:
            - available
            - metadata_only
            - unavailable
        local_asset_id:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9_-]{1,128}$
        sha256: *a7
      required:
        - id
        - data_revision
        - title
        - kind
        - canonical_url
        - doi
        - publication_date
        - retrieved_at
        - license
        - availability
        - local_asset_id
        - sha256
      additionalProperties: false
    Locator:
      type: object
      properties:
        page:
          type:
            - integer
            - "null"
        section: *a7
        row_key: *a7
        start_s: *a10
        end_s: *a10
      required:
        - page
        - section
        - row_key
        - start_s
        - end_s
      additionalProperties: false
    Evidence:
      type: object
      properties:
        id: *a8
        data_revision: *a3
        source_id: *a8
        kind:
          type: string
          enum:
            - text_excerpt
            - table_row
            - video_span
            - metadata
        locator:
          $ref: "#/components/schemas/Locator"
        excerpt: *a7
        table_values:
          type: array
          items:
            type: object
            properties:
              field: *a3
              raw_value: *a3
              raw_unit: *a7
            required:
              - field
              - raw_value
              - raw_unit
            additionalProperties: false
        verified: &a13
          type: boolean
        verification_note: *a7
      required:
        - id
        - data_revision
        - source_id
        - kind
        - locator
        - excerpt
        - table_values
        - verified
        - verification_note
      additionalProperties: false
    Material:
      type: object
      properties:
        id: *a8
        label: *a3
        state:
          $ref: "#/components/schemas/FuelState"
        composition: *a7
        aliases:
          type: array
          items: *a3
      required:
        - id
        - label
        - state
        - composition
        - aliases
      additionalProperties: false
    Investigation:
      type: object
      properties:
        id: *a8
        data_revision: *a3
        psi_id: *a3
        acronym: *a3
        title: *a3
        objectives:
          type: array
          items: *a3
        setup_summary: *a3
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        fuel_states:
          type: array
          items:
            $ref: "#/components/schemas/FuelState"
        gravity_regimes:
          type: array
          items:
            $ref: "#/components/schemas/Gravity"
        material_ids: *a9
        source_ids: *a9
        claim_ids: *a9
        conditions_coverage:
          type: array
          items:
            type: object
            properties:
              field: *a3
              min_value: *a10
              max_value: *a10
              unit:
                $ref: "#/components/schemas/Unit"
              known_count: &a11
                type: integer
              unknown_count: *a11
              derivation_evidence_ids: *a9
            required:
              - field
              - min_value
              - max_value
              - unit
              - known_count
              - unknown_count
              - derivation_evidence_ids
            additionalProperties: false
        available_assets: *a9
      required:
        - id
        - data_revision
        - psi_id
        - acronym
        - title
        - objectives
        - setup_summary
        - scopes
        - fuel_states
        - gravity_regimes
        - material_ids
        - source_ids
        - claim_ids
        - conditions_coverage
        - available_assets
      additionalProperties: false
    TestRun:
      type: object
      properties:
        id: *a8
        data_revision: *a3
        investigation_id: *a8
        source_test_id: *a3
        material_id:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9_-]{1,128}$
        sample:
          type: object
          properties:
            geometry:
              $ref: "#/components/schemas/Geometry"
            thickness:
              $ref: "#/components/schemas/Quantity"
            initial_diameter:
              $ref: "#/components/schemas/Quantity"
          required:
            - geometry
            - thickness
            - initial_diameter
          additionalProperties: false
        conditions:
          type: object
          properties:
            gravity_regime:
              $ref: "#/components/schemas/Gravity"
            gravity_level:
              $ref: "#/components/schemas/Quantity"
            oxygen_fraction:
              $ref: "#/components/schemas/Quantity"
            pressure:
              $ref: "#/components/schemas/Quantity"
            airflow_speed:
              $ref: "#/components/schemas/Quantity"
            flow_configuration:
              type: string
              enum:
                - concurrent
                - opposed
                - quiescent
                - other
                - unknown
            ambient_temperature:
              $ref: "#/components/schemas/Quantity"
          required:
            - gravity_regime
            - gravity_level
            - oxygen_fraction
            - pressure
            - airflow_speed
            - flow_configuration
            - ambient_temperature
          additionalProperties: false
        metrics:
          type: array
          items:
            type: object
            properties:
              metric_key:
                type: string
                enum:
                  - burn_duration
                  - visible_extinction_diameter
                  - flame_spread_rate
                  - particle_diameter
              quantity:
                $ref: "#/components/schemas/Quantity"
            required:
              - metric_key
              - quantity
            additionalProperties: false
        terminal_outcome:
          type: object
          properties:
            category:
              type: string
              enum:
                - no_ignition
                - extinction
                - burn_to_completion
                - disruption
                - ongoing_at_stop
                - smoke_measurement
                - unknown
            raw_label: *a3
            interpretation_status:
              type: string
              enum:
                - source_explicit
                - reviewed_mapping
                - unmapped
            evidence_ids: *a9
          required:
            - category
            - raw_label
            - interpretation_status
            - evidence_ids
          additionalProperties: false
        regime_tags:
          type: array
          items: *a3
        evidence_ids: *a9
        quality_notes:
          type: array
          items: *a3
      required:
        - id
        - data_revision
        - investigation_id
        - source_test_id
        - material_id
        - sample
        - conditions
        - metrics
        - terminal_outcome
        - regime_tags
        - evidence_ids
        - quality_notes
      additionalProperties: false
    Claim:
      type: object
      properties:
        id: *a8
        data_revision: *a3
        investigation_ids: *a9
        kind:
          type: string
          enum:
            - observation
            - synthesis
            - hypothesis
        text: *a3
        supporting_evidence_ids: *a9
        contradicting_evidence_ids: *a9
        applicable_run_ids: *a9
        limitations:
          type: array
          items: *a3
        review_status:
          type: string
          enum:
            - reviewed
            - pending
            - rejected
      required:
        - id
        - data_revision
        - investigation_ids
        - kind
        - text
        - supporting_evidence_ids
        - contradicting_evidence_ids
        - applicable_run_ids
        - limitations
        - review_status
      additionalProperties: false
    Scenario:
      type: object
      properties:
        scenario_id: *a8
        name: *a3
        environment:
          type: string
          enum:
            - orbital_habitat
            - surface_habitat
            - pressurized_rover
            - custom
        celestial_body:
          type:
            - string
            - "null"
          enum:
            - earth
            - moon
            - mars
            - other
        safety_task:
          $ref: "#/components/schemas/Scope"
        material_ids: *a9
        geometry:
          anyOf:
            - $ref: "#/components/schemas/Geometry"
            - type: "null"
        oxygen_fraction:
          anyOf:
            - $ref: "#/components/schemas/Quantity"
            - type: "null"
        pressure:
          anyOf:
            - $ref: "#/components/schemas/Quantity"
            - type: "null"
        airflow_speed:
          anyOf:
            - $ref: "#/components/schemas/Quantity"
            - type: "null"
        gravity_regime:
          $ref: "#/components/schemas/Gravity"
        assumptions:
          type: array
          items:
            type: object
            properties:
              field: *a3
              text: *a3
              origin:
                type: string
                enum:
                  - user
                  - preset_source
                  - derived
              source_ids: *a9
            required:
              - field
              - text
              - origin
              - source_ids
            additionalProperties: false
      required:
        - scenario_id
        - name
        - environment
        - celestial_body
        - safety_task
        - material_ids
        - geometry
        - oxygen_fraction
        - pressure
        - airflow_speed
        - gravity_regime
        - assumptions
      additionalProperties: false
    Workspace:
      type: object
      properties:
        id: *a8
        revision:
          type: integer
          minimum: 1
        scenario:
          $ref: "#/components/schemas/Scenario"
        selected_investigation_ids:
          type: array
          items: *a8
          maxItems: 3
        saved_investigation_ids:
          type: array
          items: *a8
          maxItems: 100
        saved_answer_ids:
          type: array
          items: *a8
          maxItems: 30
        data_revision: *a3
        created_at: *a12
        updated_at: *a12
        expires_at: *a12
      required:
        - id
        - revision
        - scenario
        - selected_investigation_ids
        - saved_investigation_ids
        - saved_answer_ids
        - data_revision
        - created_at
        - updated_at
        - expires_at
      additionalProperties: false
    WorkspacePatch:
      type: object
      properties:
        scenario:
          $ref: "#/components/schemas/Scenario"
        selected_investigation_ids:
          type: array
          items: *a8
          maxItems: 3
        saved_investigation_ids:
          type: array
          items: *a8
          maxItems: 100
        saved_answer_ids:
          type: array
          items: *a8
          maxItems: 30
      required: []
      additionalProperties: false
    Range:
      type: object
      properties:
        min: *a10
        max: *a10
        unit:
          $ref: "#/components/schemas/Unit"
      required:
        - min
        - max
        - unit
      additionalProperties: false
    Filters:
      type: object
      properties:
        scopes:
          type: array
          items:
